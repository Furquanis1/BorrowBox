# Test profile uses MySQL for integration testing.
# Credentials MUST be supplied explicitly via environment variables.
# Do NOT rely on committed defaults. Use a verified disposable database.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Run the same version-controlled schema.sql so validation passes under the test profile
spring.sql.init.mode=always

# Keep the seed disabled by default in tests; seed tests invoke the initializer directly.
# This password exists only for those direct seed() calls and is never used by
# production or the demo launcher.
borrowbox.seed.enabled=false
borrowbox.seed.password=${BORROWBOX_SEED_PASSWORD:}

# V2.2.6: evidence binaries land in the OS temp dir under the test profile.
borrowbox.media.dir=${java.io.tmpdir}/borrowbox-test-media
borrowbox.evidence.max-size-bytes=5242880

# JWT configuration for tests - must be supplied explicitly (Base64-encoded), no committed default.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000
