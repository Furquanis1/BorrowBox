# Test profile uses the real MySQL database for integration testing.
# V2.1.1 runs against the fresh V2 database (V1 data is not migrated).
spring.datasource.url=jdbc:mysql://localhost:3306/borrowbox_v2
spring.datasource.username=root
spring.datasource.password=khan@123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Run the same version-controlled schema.sql so validation passes under the test profile
spring.sql.init.mode=always

# Keep the seed disabled by default in tests; seed tests invoke the initializer directly.
borrowbox.seed.enabled=false
