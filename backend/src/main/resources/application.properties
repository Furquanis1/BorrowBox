# Server Configuration
server.port=8080

# Database Configuration
# V2.1.1 uses a fresh V2 database; V1 data is not migrated.
spring.datasource.url=jdbc:mysql://localhost:3306/borrowbox_v2
spring.datasource.username=root
spring.datasource.password=khan@123

# JPA/Hibernate Configuration
# V2.1.1 uses a version-controlled schema.sql baseline with validation mode.
# schema.sql runs first (during DataSource init); Hibernate validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Script-based schema initialization from the version-controlled schema.sql
spring.sql.init.mode=always
# V2.5.2: schema.sql is CREATE TABLE IF NOT EXISTS only, so it cannot upgrade a
# pre-existing `transactions` table while ddl-auto=validate still demands the new
# column. schema-patch.sql is additive and idempotent and is a no-op on a fresh
# database. The supported full-reset path remains scripts/reset-v2-db.ps1.
spring.sql.init.schema-locations=classpath:schema.sql,classpath:schema-patch.sql

# V2.1.1 idempotent/deterministic development seed (Users + Communities + Memberships)
borrowbox.seed.enabled=true

# Quiet the PageImpl serialization warning in controller tests and runtime logs.
logging.level.org.springframework.data.web.support.PageModule$WarningLoggingModifier=OFF

# Application name
spring.application.name=BorrowBox API

# JWT configuration
app.jwt.secret=Qm9ycm93Qm94LURldkZ1bGxTaWduaW5nS2V5LTIwMjYtMDUtMDQ=
app.jwt.expiration-ms=86400000

# V2.2.6 evidence storage. Binaries live off-database on the server media
# directory under UUID-only file names and are served only through the
# authenticated, participant-only content endpoint (never statically).
borrowbox.media.dir=./media
borrowbox.evidence.max-size-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# V2.5.2 reservation expiry TTLs.
#
# Each TTL is a duration, not an absolute time, and is measured from the moment
# the transaction ENTERS that phase -- not from created_at, not from reserved_at,
# and never from updated_at. Entering a phase re-stamps a fresh deadline, so a
# long-lived PENDING that gets approved receives a full APPROVED window rather
# than expiring on a deadline computed from its original creation time.
#
# Expiry is deliberately confined to the four states that hold an AssetUnit in
# RESERVED while nobody is actively using it. ACTIVE / RETURN_INITIATED /
# RETURN_REPORTED hold BORROWED (out of scope), and RETURN_DISPUTED deliberately
# freezes its unit until a human resolves the dispute.
#
# Expiry is executed by an opportunistic sweep on the paths that already take
# the AssetUnit availability lock (transaction create, waitlist join). There is
# no scheduler and no background worker: with no traffic, a stale reservation
# simply stays stale until the next request for that asset. That is the intended
# trade-off for this slice.
borrowbox.reservation.enabled=true
borrowbox.reservation.pending-hours=72
borrowbox.reservation.counter-offer-hours=48
borrowbox.reservation.approved-hours=72
borrowbox.reservation.handover-hours=168