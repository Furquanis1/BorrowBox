name: Build and Test

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  ci-secret-check:
    name: Validate CI database secret
    runs-on: ubuntu-latest
    steps:
      - name: Require CI_MYSQL_ROOT_PASSWORD
        env:
          CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        run: |
          if [ -z "${CI_MYSQL_ROOT_PASSWORD:-}" ]; then
            echo "::error title=Missing CI secret::The CI_MYSQL_ROOT_PASSWORD repository secret is not available to this workflow run. Configure it in Settings > Secrets and variables > Actions."
            exit 1
          fi

  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    needs: ci-secret-check

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: borrowbox_ci_test
          MYSQL_ROOT_HOST: "%"
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate test credentials
        run: |
          TEST_DB_PASSWORD="$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          E2E_PASSWORD="$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          SEED_PASSWORD="$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$TEST_DB_PASSWORD"
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$SEED_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          {
            echo "BORROWBOX_APP_DB_PASSWORD=$TEST_DB_PASSWORD"
            echo "BORROWBOX_E2E_DB_PASSWORD=$E2E_PASSWORD"
            echo "BORROWBOX_SEED_PASSWORD=$SEED_PASSWORD"
            echo "APP_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Bootstrap database accounts
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: borrowbox_ci_test
          MYSQL_ROOT_USER: root
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          BORROWBOX_APP_DB_USER: borrowbox_ci_test
        run: bash scripts/bootstrap-mysql.sh

      - name: Run Backend Tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/borrowbox_ci_test
          SPRING_DATASOURCE_USERNAME: borrowbox_ci_test
          SPRING_DATASOURCE_PASSWORD: ${{ env.BORROWBOX_APP_DB_PASSWORD }}
        run: mvn clean test -Dspring.datasource.url=jdbc:mysql://127.0.0.1:3306/borrowbox_ci_test -Dspring.datasource.username=borrowbox_ci_test -Dspring.datasource.password=${BORROWBOX_APP_DB_PASSWORD}

      - name: Package Backend JAR
        working-directory: backend
        run: mvn -DskipTests package

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend Assets
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Images Build
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: borrowbox-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: borrowbox-frontend:latest

      - name: Verify Docker Compose Config
        env:
          MYSQL_ROOT_PASSWORD: compose-config-root-only
          BORROWBOX_APP_DB_PASSWORD: compose-config-app-only
          BORROWBOX_E2E_DB_PASSWORD: compose-config-e2e-only
          APP_JWT_SECRET: compose-config-jwt-only
        run: docker compose config --quiet
