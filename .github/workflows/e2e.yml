name: E2E Tests

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  cypress-e2e:
    name: Cypress End-to-End Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: borrowbox_db
          MYSQL_ROOT_HOST: "%"
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Generate test credentials
        run: |
          APP_PASSWORD="$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          E2E_PASSWORD="$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          SEED_PASSWORD="$(openssl rand -base64 32 | tr -d '\n=' | tr '+/' '-_')"
          JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$E2E_PASSWORD"
          echo "::add-mask::$SEED_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          {
            echo "BORROWBOX_APP_DB_PASSWORD=$APP_PASSWORD"
            echo "BORROWBOX_E2E_DB_PASSWORD=$E2E_PASSWORD"
            echo "BORROWBOX_SEED_PASSWORD=$SEED_PASSWORD"
            echo "APP_JWT_SECRET=$JWT_SECRET"
          } >> "$GITHUB_ENV"

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Bootstrap database accounts
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: borrowbox_db
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
        run: bash scripts/bootstrap-mysql.sh

      - name: Guard against hardcoded Cypress passwords
        working-directory: frontend
        run: |
          if grep -R -n --include='*.cy.js' -E "(const (ahmed|salah|omar|youssef|karim) = .*password: '|const password = '|password: ')" cypress/e2e; then
            echo "Test credentials must come from Cypress.env('seedPassword') or Cypress.env('testUserPassword')." >&2
            exit 1
          fi

      - name: Build and Start Backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/borrowbox_db
          SPRING_DATASOURCE_USERNAME: borrowbox_app
          BORROWBOX_SEED_ENABLED: 'true'
        run: |
          export SPRING_DATASOURCE_PASSWORD="$BORROWBOX_APP_DB_PASSWORD"
          mvn -DskipTests package -q
          nohup java -jar target/*.jar &
          echo "Waiting for backend to start..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "Backend is ready."
              break
            fi
            sleep 2
          done

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and Serve Frontend
        working-directory: frontend
        run: |
          npm run build
          npx vite preview --host 0.0.0.0 --port 3000 &
          echo "Waiting for frontend to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is ready."
              break
            fi
            sleep 2
          done

      - name: Run Cypress Tests
        working-directory: frontend
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          CYPRESS_DB_HOST: 127.0.0.1
          CYPRESS_DB_PORT: '3306'
          CYPRESS_DB_NAME: borrowbox_db
          CYPRESS_DB_USER: borrowbox_e2e
        run: |
          export CYPRESS_DB_PASSWORD="$BORROWBOX_E2E_DB_PASSWORD"
          export CYPRESS_SEED_PASSWORD="$BORROWBOX_SEED_PASSWORD"
          npx cypress run --headless --browser chrome

      - name: Upload Cypress Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots
          retention-days: 7
