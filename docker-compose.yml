services:
  mysql:
    image: mysql:8.0
    container_name: borrowbox-mysql
    environment:
      MYSQL_DATABASE: borrowbox_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: borrowbox-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/borrowbox_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: borrowbox-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
